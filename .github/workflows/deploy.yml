name: Deploy Sales API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lean & Clean Setup
        run: |
          # 1. Move into app directory
          cd /home/ubuntu/app
          
          # 2. Emergency Clean: Remove old build artifacts to save disk space
          rm -rf node_modules dist .cache
          
          # 3. Lean Install: --production skips devDependencies (saves RAM/Disk)
          # --no-audit stops GitHub from scanning during build (saves CPU)
          npm install --production --no-audit --no-fund --prefer-offline

      - name: Build Project
        run: |
          cd /home/ubuntu/app
          # Ensure your build script exists in package.json
          npm run build --if-present

      - name: Restart API with PM2
        run: |
          cd /home/ubuntu/app
          # --update-env ensures new secrets/config are loaded
          pm2 restart sales-api --update-env || pm2 start dist/main.js --name sales-api